<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <main>
        <article class="profile-card">
            <!-- Banner -->
            <div class="profile-banner"></div>

            <!-- Profile avatar -->
            <div class="profile-avatar">
                <img src="profile.png" alt="Profile">
            </div>

            <!-- Edit Profile -->
            <button class="edit-btn">✎ Edit Profile</button>

            <!-- Profile information -->
            <div class="profile-info">
                <div class="username">
                    <h2>Priya Dharshini</h2>
                    <p>@Software Engineer</p>
                </div>
            </div>

            <div class="actions">
                <button class="follow-btn">Follow</button>
                <button class="message-btn">💬</button>
            </div>

            <!-- Description -->
            <p class="description">
                Full-stack developer passionate about building
                beautiful, performant web applications. Open source
                contributor and TypeScript enthusiast.
            </p>
            <div class="line">
                <hr>
            </div>

            <div class="profile-data">
                <div class="data-item">
                    <h2>1.2k</h2>
                    <p>Followers</p>
                </div>
                <div class="data-item">
                    <h2>500</h2>
                    <p>Following</p>
                </div>
                <div class="data-item">
                    <h2>50</h2>
                    <p>Posts</p>
                </div>
            </div>
        </article>
    </main>

</body>

</html>
